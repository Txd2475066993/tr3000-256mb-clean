name: Build TR3000 256MB Clean Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tr3000-clean-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev libxml2-dev \
            python3-setuptools python3-pyelftools python3-yaml rsync swig unzip \
            zlib1g-dev file wget curl zstd time

      - name: Fetch official OpenWrt source
        run: |
          git clone --depth 1 --branch v25.12.6 https://github.com/openwrt/openwrt.git openwrt
          test "$(git -C openwrt describe --tags --exact-match)" = "v25.12.6"

      - name: Add pinned Shadcn theme and OpenClash source
        working-directory: openwrt
        run: |
          set -eux
          THEME_COMMIT=1830d0a78b74709a1214565f56cfe50a6a9a0084
          OPENCLASH_COMMIT=e553e82e01c697aefbe1555261a503f425e00ccd

          mkdir -p package/luci-theme-shadcn package/luci-app-openclash /tmp/openclash-src

          git -C package/luci-theme-shadcn init
          git -C package/luci-theme-shadcn remote add origin https://github.com/eamonxg/luci-theme-shadcn.git
          git -C package/luci-theme-shadcn fetch --depth=1 origin "$THEME_COMMIT"
          git -C package/luci-theme-shadcn checkout --detach FETCH_HEAD

          git -C /tmp/openclash-src init
          git -C /tmp/openclash-src remote add origin https://github.com/vernesong/OpenClash.git
          git -C /tmp/openclash-src fetch --depth=1 origin "$OPENCLASH_COMMIT"
          git -C /tmp/openclash-src checkout --detach FETCH_HEAD
          cp -a /tmp/openclash-src/luci-app-openclash/. package/luci-app-openclash/

          test -f package/luci-theme-shadcn/Makefile
          test -f package/luci-app-openclash/Makefile

      - name: Install official OpenWrt feeds
        working-directory: openwrt
        run: |
          set -eux
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure exact TR3000 256MB V1 profile
        working-directory: openwrt
        run: |
          set -eux
          cat >> .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-256mb-v1=y

          # Minimal LuCI administration stack (no full application bundle).
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-theme-shadcn=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_rpcd-mod-rrdns=y
          CONFIG_PACKAGE_luci-compat=y

          # Simplified Chinese translations (zh_Hans maps to zh-cn package names).
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          # OpenClash LuCI app and required runtime dependencies.
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG

          install -D -m 0755 ../files/etc/uci-defaults/99-tr3000-clean-defaults \
            package/base-files/files/etc/uci-defaults/99-tr3000-clean-defaults

          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-256mb-v1=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-shadcn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' .config
          grep -q '^CONFIG_LUCI_LANG_zh_Hans=y$' .config

      - name: Build LuCI translation host tool
        working-directory: openwrt
        run: make package/feeds/luci/luci-base/host/compile -j2 V=s

      - name: Download source archives
        working-directory: openwrt
        run: make download -j2

      - name: Compile firmware
        working-directory: openwrt
        run: make -j"$(nproc)" V=s

      - name: Verify image and prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          OUT="openwrt/bin/targets/mediatek/filogic"
          IMAGE=$(find "$OUT" -maxdepth 1 -type f \
            -name '*cudy_tr3000-256mb-v1*squashfs-sysupgrade.bin' -print -quit)
          MANIFEST=$(find "$OUT" -maxdepth 1 -type f -name '*mediatek-filogic.manifest' -print -quit)

          test -n "$IMAGE"
          test -s "$MANIFEST"
          tar -tf "$IMAGE" >/dev/null

          grep -q '^luci-app-openclash ' "$MANIFEST"
          grep -q '^luci-theme-shadcn ' "$MANIFEST"
          grep -q '^luci-i18n-base-zh-cn ' "$MANIFEST"
          grep -q '^luci-i18n-firewall-zh-cn ' "$MANIFEST"

          cp "$IMAGE" ./TR3000-256MB-Clean-sysupgrade.bin
          cp "$MANIFEST" ./TR3000-256MB.manifest
          cp openwrt/.config ./build.config
          {
            echo 'Device: Cudy TR3000 256MB V1'
            echo 'Device profile: cudy_tr3000-256mb-v1'
            echo 'OpenWrt tag: v25.12.6'
            echo 'Shadcn commit: 1830d0a78b74709a1214565f56cfe50a6a9a0084'
            echo 'OpenClash commit: e553e82e01c697aefbe1555261a503f425e00ccd'
            echo 'Image type: SquashFS SYSUPGRADE'
            echo 'Build source: official OpenWrt source; no openwrt.ai feed'
          } > BUILD-INFO.txt
          sha256sum TR3000-256MB-Clean-sysupgrade.bin TR3000-256MB.manifest build.config BUILD-INFO.txt > SHA256SUMS.txt
          ls -lh TR3000-256MB-Clean-sysupgrade.bin TR3000-256MB.manifest build.config BUILD-INFO.txt SHA256SUMS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TR3000-256MB-Clean
          path: |
            TR3000-256MB-Clean-sysupgrade.bin
            TR3000-256MB.manifest
            build.config
            BUILD-INFO.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
